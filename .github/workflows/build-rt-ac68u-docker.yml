# Build RT-AC68U Merlin firmware (Docker)
#
# Design sources:
# - Official wiki: RT-AC68U is a Broadcom SDK6/SDK7 ARM platform, built
#   with `make rt-ac68u` in release/src-rt-6.x.4708.
# - oivano/asuswrt-merlin.ng tools/build.sh: builds with the SDK6 toolchain
#   inside Docker. DSL-AC68U and RT-AC68U share the same src-rt-6.x.4708
#   tree and toolchain, so at the build level changing dsl-ac68u to
#   rt-ac68u is enough. Note: oivano's repo itself is a DSL-AC68U-specific
#   fork (with DSL firmware packaging and its own features); this
#   workflow's source uses RMerl upstream 386.14_2 instead, borrowing only
#   oivano's Docker build method, not its tree.
# - oivano used CircleCI; this workflow ports the same method to GitHub Actions.
#
# Usage: go to the Actions tab, Run workflow, and download the .trx from
# Artifacts when the build finishes.
#
# Artifact layout: the .trx, its .sha256, and build.log are staged into
# merlin/release/ before upload, so the downloaded artifact zip contains
# the files directly instead of nested under
# release/src-rt-6.x.4708/image/. upload-artifact v4 uses the least common
# ancestor of all upload paths as the artifact root, so paths all under
# merlin/release/ upload flat. The merlin/release/*.trx glob is
# non-recursive, so the source tree under merlin/release/ is not picked up.

name: Build RT-AC68U Merlin firmware (Docker)

on:
  workflow_dispatch:
    inputs:
      merlin_ref:
        description: "Branch or tag of RMerl/asuswrt-merlin.ng (default: the last 386 release)"
        required: true
        default: "386.14_2"
      toolchain_image:
        description: "Docker image containing the SDK6 toolchain (the one used by the oivano project)"
        required: true
        default: "ivano/asuswrt-merlin-toolchains-custom:latest"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A full SDK6 build with -j1 is slow; allow up to the GitHub job limit of 6 hours
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        # Merlin source plus build products need 10GB or more; clear the runner's pre-installed large items first
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Checkout Merlin source
        uses: actions/checkout@v4
        with:
          repository: RMerl/asuswrt-merlin.ng
          ref: ${{ inputs.merlin_ref }}
          path: merlin
          fetch-depth: 1

      - name: Pull toolchain image
        run: docker pull "${{ inputs.toolchain_image }}"

      - name: Build RT-AC68U firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/merlin:/home/docker/project" \
            -w /home/docker/project \
            -u "$(id -u):$(id -g)" \
            "${{ inputs.toolchain_image }}" \
            bash -c '
              set -euo pipefail
              cd /home/docker/project
              # The mount point intentionally matches oivano's CircleCI setting
              # (/home/docker/project), so the relative symlink
              # ../../../am-toolchains/brcm-arm-sdk points to the toolchain
              # SDK built into the image.
              SDK_DIR=/home/docker/am-toolchains/brcm-arm-sdk
              if [ -d "$SDK_DIR/hndtools-arm-linux-2.6.36-uclibc-4.5.3" ]; then
                TOOLCHAIN_BIN="$SDK_DIR/hndtools-arm-linux-2.6.36-uclibc-4.5.3"
                if [ ! -e release/src-rt-6.x.4708/toolchains ]; then
                  ln -s ../../../am-toolchains/brcm-arm-sdk release/src-rt-6.x.4708/toolchains
                fi
              elif [ -d /opt/brcm-arm ]; then
                TOOLCHAIN_BIN=/opt/brcm-arm
              else
                echo "Error: SDK6 toolchain not found in image" >&2
                exit 1
              fi
              export PATH="$PATH:$TOOLCHAIN_BIN/bin"
              export LD_LIBRARY_PATH="$TOOLCHAIN_BIN/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              export MAKEFLAGS="-j 1"
              export MERLINUPDATE=y
              cd release/src-rt-6.x.4708
              # Close stdin: an unanswered Kconfig option during make would wait
              # for input, and CI without a TTY would hang there
              make clean </dev/null
              make rt-ac68u </dev/null 2>&1 | tee ../../build.log
              ls -lh image/
            '

      - name: Generate checksums
        run: |
          cd merlin/release/src-rt-6.x.4708/image
          for f in *.trx; do sha256sum "$f" > "$f.sha256"; done
          ls -lh

      - name: Stage firmware for upload (flat, under release/)
        # Flatten the artifact layout: copy the .trx, its .sha256, and
        # build.log into merlin/release/, so the downloaded artifact zip
        # contains the files directly instead of nested under
        # release/src-rt-6.x.4708/image/. See the file header for why this
        # works (least-common-ancestor root) and why the source tree under
        # merlin/release/ is not picked up (non-recursive glob).
        run: |
          cp merlin/release/src-rt-6.x.4708/image/*.trx merlin/release/src-rt-6.x.4708/image/*.trx.sha256 merlin/release/
          cp merlin/build.log merlin/release/
          ls -lh merlin/release/*.trx merlin/release/*.trx.sha256 merlin/release/build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RT-AC68U-merlin-${{ inputs.merlin_ref }}
          path: |
            merlin/release/*.trx
            merlin/release/*.trx.sha256
            merlin/release/build.log
          if-no-files-found: error
