name: Component watch

# Daily check for new upstream component releases and recent CVEs.
# Runs on GitHub Actions (no VM tokens used). Maintains ONE rolling issue
# ("[component-watch] Component releases and CVEs — rolling status",
# label "component-watch") whose body is rewritten on every run; it never
# opens a new issue per run. State lives in component-watch/state.json.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check releases and CVEs, update rolling issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 component-watch/watch.py

      - name: Commit state
        run: |
          git config user.name "component-watch"
          git config user.email "component-watch@users.noreply.github.com"
          git add component-watch/state.json
          git diff --cached --quiet || git commit -m "component-watch: update state"
          git push
